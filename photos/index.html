<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bella Luna's Photos</title>
<meta name="description" content="Share and see the photos from Bella Luna's 7th birthday.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Satisfy&display=swap" rel="stylesheet">
<style>
:root { --plum: #8e2f6a; --ink: #4e1c42; --rose: #c98fb2; --soft: #a0577f; --blush: #fbeef5; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: Quicksand, sans-serif; color: var(--ink);
  background: radial-gradient(ellipse at 50% 0%, #f3e4ff 0%, var(--blush) 50%, #ffe3ee 100%); }
main { max-width: 480px; margin: 0 auto; padding: 40px 20px 48px; text-align: center; position: relative; }
.photo { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 14px; border: 6px solid #fff;
  box-shadow: 0 0 0 3px #e8c3d8; background: url("../images/photo-1.jpg") center 22% / cover; }
.k { font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--rose); }
h1 { font-family: Satisfy, cursive; font-weight: 400; font-size: 54px; line-height: 1.05; color: var(--plum); margin: 6px 0 10px; }
p.lead { font-size: 17px; font-weight: 600; line-height: 1.5; margin: 0 0 26px; }
.btn { display: block; width: 100%; padding: 18px 20px; margin: 0 0 14px; border-radius: 999px; font: 700 18px Quicksand, sans-serif;
  text-decoration: none; border: 0; cursor: pointer; }
.btn.main { background: var(--plum); color: #fff; box-shadow: 0 8px 20px rgba(142,47,106,.28); }
.btn.alt { background: #fff; color: var(--plum); box-shadow: 0 0 0 2px #e8c3d8 inset; }
.btn.off { background: #f1e3ec; color: #a98a9c; pointer-events: none; box-shadow: none; }
.btn small { display: block; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 2px; }
.steps-unused { text-align: left; background: rgba(255,255,255,.7); border-radius: 20px; padding: 18px 20px; margin: 10px 0 26px;
  box-shadow: 0 0 0 2px #f0d5e4; }
.steps div { display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 15.5px; padding: 6px 0; }
.steps b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--plum); color: #fff; display: grid; place-items: center; font-size: 14px; }
.foot { font-family: Satisfy, cursive; font-size: 26px; color: var(--soft); margin-top: 26px; }
.date { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--soft); }
.deco { position: absolute; pointer-events: none; }
a.home { color: var(--soft); font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// Links. Leave a link "" until it is ready: its button shows "coming soon".
const LINKS = {
  upload: "https://ug.link/dh2300-f6d2/photo/share/?id=0&pagetype=invite&uuid=a6fb4c54-8cc3-43e4-b00d-d33e7ad43b68",                                         // NAS upload link (guests add photos, no login)
  guests: "https://ug.link/dh2300-f6d2/photo/share/?id=1&pagetype=share&uuid=edbe2fd9-b9b3-443b-9b61-9fd77f3ef21d",                                         // NAS view link (see what guests shared)
  official: "https://photos.app.goo.gl/vG4q5iqJgJ1rbV5x8" // photographer + photo booth album
};
const btn = (url, cls, label, sub) => url
  ? `<a class="btn ${cls}" href="${url}" target="_blank" rel="noopener">${label}<small>${sub}</small></a>`
  : `<span class="btn off">${label}<small>coming soon</small></span>`;
const daisy = (x, y, r, c) => `<svg class="deco" style="${x}:${-r / 2}px;top:${y}px" width="${r * 2}" height="${r * 2}" viewBox="-50 -50 100 100">${
  [...Array(8)].map((_, k) => `<ellipse rx="13" ry="30" cy="-24" fill="${c}" transform="rotate(${k * 45})"/>`).join("")}<circle r="14" fill="#f5c04e"/></svg>`;
document.title = "Bella Luna's Memories";
document.getElementById("app").innerHTML = daisy("left", 10, 46, "#fff") + daisy("right", 30, 40, "#ffd6e7") + `
  <div class="photo"></div>
  <div class="k">Bella Luna turns 7</div>
  <h1>Share &amp; See Our Memories</h1>
  <p class="lead">Took a photo of Luna tonight? Send it to us, no app and no login needed. Then come back to see everyone's photos.</p>
  ${btn(LINKS.upload, "main", "Upload your photos", "pick your favorite photos and videos")}
  ${btn(LINKS.official, "alt", "Official photos", "photographer and photo booth")}
  ${btn(LINKS.guests, "alt", "Photos from our guests", "everything you shared")}
  <div class="foot">Thank you for making her day!</div>
  <div class="date">Nov 14, 2026 · Sundays Cafe, Marikina</div>
  <p><a class="home" href="../">Back to the invitation</a></p>`;
</script>
</body>
</html>
